<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotlight 5 — задания, страницы 12–13</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ddd;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hint {
      margin: 14px;
      text-align: center;
      font-size: 15px;
    }

    .sheet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: 4mm;
      width: 297mm;
      height: 210mm;
      margin: 8mm auto;
      padding: 6mm;
      overflow: hidden;
      background: #fff;
    }

    .page {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
    }

    .mask {
      position: absolute;
      z-index: 1;
      background: #fff;
    }

    .top-right-mask {
      top: 0;
      right: 0;
      width: 10%;
      height: 2.5%;
    }

    .page-number-mask {
      right: 0;
      bottom: 0;
      width: 4%;
      height: 3%;
    }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {
      html,
      body {
        background: #fff;
      }

      .hint {
        display: none;
      }

      .sheet {
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <p class="hint">
    Печатайте на горизонтальном листе A4, масштаб 100%, поля — «Нет».
  </p>

  <main class="sheet">
    <section class="page" aria-label="Задания со страницы 12">
      <img
        src="spotlight-5-assets/task-page-13.png"
        alt="Задания Numbers со страницы 12 рабочей тетради Spotlight 5"
      >
    </section>

    <section class="page" aria-label="Задания со страницы 13">
      <img
        src="spotlight-5-assets/task-page-14.png"
        alt="Задания Colours со страницы 13 рабочей тетради Spotlight 5"
      >
      <span class="mask top-right-mask" aria-hidden="true"></span>
      <span class="mask page-number-mask" aria-hidden="true"></span>
    </section>
  </main>
</body>
</html>
