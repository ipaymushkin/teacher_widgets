<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotlight 4 — задания, страницы 6–7</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ddd;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hint {
      margin: 14px;
      text-align: center;
      font-size: 15px;
    }

    .sheet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: 4mm;
      width: 297mm;
      height: 210mm;
      margin: 8mm auto;
      padding: 6mm;
      overflow: hidden;
      background: #fff;
    }

    .page {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Закрывает розовый номер раздела в правом верхнем углу страницы 7. */
    .page-right::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 14%;
      height: 8%;
      background: #fff;
    }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {
      html,
      body {
        background: #fff;
      }

      .hint {
        display: none;
      }

      .sheet {
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <p class="hint">
    Печатайте на горизонтальном листе A4, масштаб 100%, поля — «Нет».
  </p>

  <main class="sheet">
    <section class="page page-left" aria-label="Задания со страницы 6">
      <img
        src="spotlight-assets/task-page-7.png"
        alt="Задания 1 и 2 со страницы 6 рабочей тетради Spotlight 4"
      >
    </section>

    <section class="page page-right" aria-label="Задания со страницы 7">
      <img
        src="spotlight-assets/task-page-8.png"
        alt="Продолжение задания 2 и задание 3 со страницы 7 рабочей тетради Spotlight 4"
      >
    </section>
  </main>
</body>
</html>
